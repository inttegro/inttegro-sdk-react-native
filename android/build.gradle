buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def inttegroNativeVersion = findProperty('inttegroNativeVersion') ?: '0.3.0'

android {
  namespace 'com.inttegro.reactnative'
  compileSdk 37

  defaultConfig {
    minSdk 26
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

react {
  libraryName = 'InttegroSpec'
  codegenJavaPackageName = 'com.inttegro.reactnative'
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "com.inttegro:inttegro-android:${inttegroNativeVersion}"
}
