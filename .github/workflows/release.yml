name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'inttegro/inttegro-sdk-react-native'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Verify the release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Install, test, and build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Pack the exact release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          tar -tzf artifacts/*.tgz | sort > artifacts/PACKAGE-CONTENTS.txt
          grep -q 'package/lib/index.js' artifacts/PACKAGE-CONTENTS.txt
          grep -q 'package/src/index.ts' artifacts/PACKAGE-CONTENTS.txt

      - name: Attest the package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATIONS.sigstore
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum ./*.tgz ./ATTESTATIONS.sigstore ./PACKAGE-CONTENTS.txt ./PROVENANCE.txt > SHA256SUMS
          )

      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "Inttegro React Native SDK ${GITHUB_REF_NAME}"
          --verify-tag

      - name: Publish the exact artifact to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: npm publish ./artifacts/*.tgz --access public --ignore-scripts --provenance

      - name: Finalize the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
